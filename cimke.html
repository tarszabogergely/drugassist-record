<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Címkenyomtató v3.0 (Webes)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tiszta webes QRius könyvtár CDN-ről -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* 100mm x 75mm Nyomtatási CSS - Böngészőhöz igazítva */
        @media print {
            @page {
                size: 100mm 75mm landscape;
                margin: 0 !important;
            }

            html, body {
                width: 100mm !important;
                height: 75mm !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: hidden !important;
                background: #fff !important;
            }

            .no-print {
                display: none !important;
            }

            .print-only-label {
                display: block !important;
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                width: 100mm !important;
                height: 75mm !important;
                padding: 4mm 5mm !important;
                box-sizing: border-box !important;
                background: #fff !important;
                page-break-before: avoid !important;
                page-break-after: avoid !important;
                page-break-inside: avoid !important;
            }
        }

        @media screen {
            .print-only-label {
                display: none;
            }
        }

        .bubble-input, .bubble-select {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 9999px;
            padding: 0.35rem 0.85rem;
            font-size: 0.8125rem;
            line-height: 1.15rem;
            color: #1e293b;
            width: 100%;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
        }

        .bubble-input:focus, .bubble-select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="flex justify-end items-stretch p-2 sm:p-3 h-screen">

    <!-- MUNKASÁV (Jobb oldalra igazított kártya) -->
    <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden flex flex-col h-full no-print">
        
        <!-- Fejléc -->
        <div class="px-4 py-2.5 bg-slate-900 text-white shrink-0">
            <div class="flex items-center space-x-2.5">
                <div class="w-7 h-7 rounded-full bg-blue-600 flex items-center justify-center text-white shrink-0">
                    <i class="fa-solid fa-hospital text-xs"></i>
                </div>
                <div>
                    <h1 class="font-semibold text-[9px] uppercase tracking-wider text-slate-300">Markusovszky Kórház</h1>
                    <h2 class="text-xs font-bold text-white tracking-wide">GYÓGYSZERTÁR v3.0 (Web)</h2>
                </div>
            </div>
            <div class="mt-1.5 pt-1.5 border-t border-slate-800 flex justify-between text-[10px] text-slate-400">
                <span>Méret:</span>
                <span class="text-blue-300 font-medium bg-slate-800 px-2 py-0.5 rounded-full border border-slate-700">10,0 × 7,5 cm</span>
            </div>
        </div>

        <!-- Űrlap -->
        <div class="px-4 py-2.5 flex-1 overflow-y-auto custom-scrollbar space-y-2">
            <div>
                <label class="block text-[10px] font-semibold text-slate-600 uppercase mb-0.5">1. Beteg Neve</label>
                <input type="text" id="patientName" placeholder="pl. Kovács János" class="bubble-input" autocomplete="off">
            </div>

            <div>
                <label class="block text-[10px] font-semibold text-slate-600 uppercase mb-0.5">2. TAJ szám</label>
                <input type="text" id="tajNum" placeholder="pl. 123 456 789" class="bubble-input" autocomplete="off">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] font-semibold text-slate-600 uppercase mb-0.5">3. Osztály</label>
                    <select id="deptName" class="bubble-select">
                        <option value="Fül-orr-gégészet">Fül-orr-gégészet</option>
                        <option value="Gasztroenterológia">Gasztroenterológia</option>
                        <option value="Infektológia">Infektológia</option>
                        <option value="Mellkassebészet">Mellkassebészet</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-600 uppercase mb-0.5">4. Ágyszám</label>
                    <input type="text" id="bedNum" placeholder="pl. 12/A" class="bubble-input" autocomplete="off">
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-semibold text-slate-600 uppercase mb-0.5">5. Dátum</label>
                <input type="date" id="labelDate" class="bubble-input">
            </div>

            <hr class="border-slate-100 my-1">

            <div>
                <label class="block text-[10px] font-semibold text-slate-600 uppercase mb-0.5">Jóváhagyta</label>
                <select id="approvedBy" class="bubble-select">
                    <option value="Gyógyszerész 1">Gyógyszerész 1</option>
                    <option value="Gyógyszerész 2">Gyógyszerész 2</option>
                </select>
            </div>

            <!-- Mini Előnézet -->
            <div class="mt-2 pt-2 border-t border-slate-200">
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Előnézet (10×7.5 cm)</span>
                
                <div class="w-full border border-slate-300 bg-white rounded-lg p-2 text-slate-900 flex flex-col justify-between shadow-sm space-y-1">
                    <div class="border-b border-slate-900/10 pb-0.5 text-center">
                        <div class="font-extrabold text-[9px] uppercase tracking-tight">Markusovszky Kórház Gyógyszertár</div>
                    </div>

                    <div class="my-auto flex justify-between items-center px-1">
                        <div class="space-y-0.5 text-[11px] leading-tight">
                            <div class="truncate font-extrabold text-black"><span id="prevName">-</span></div>
                            <div class="truncate text-slate-700 font-semibold"><span id="prevTaj">-</span></div>
                            <div class="truncate"><span id="prevDept">-</span></div>
                            <div class="truncate"><span id="prevBed">-</span></div>
                            <div class="truncate font-semibold text-slate-700 pt-0.5"><span id="prevDate">-</span></div>
                        </div>
                        <div class="flex justify-center items-center shrink-0">
                            <canvas id="previewQR" class="border p-0.5 rounded bg-slate-50 max-w-[55px] max-h-[55px]"></canvas>
                        </div>
                    </div>

                    <div class="border-t border-slate-900/10 pt-0.5 text-[8px] text-slate-700 font-medium">
                        <div class="flex justify-between">
                            <span id="prevApprove">Jóváhagyta: -</span>
                        </div>
                        <div class="text-center text-[7px] font-mono text-slate-400">
                            Azonosító: <span id="prevID">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Gombok -->
        <div class="p-3 bg-slate-50 border-t border-slate-200 space-y-1.5 shrink-0">
            <button onclick="generateAndPrint()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-3 rounded-xl text-xs uppercase tracking-wider flex items-center justify-center space-x-2 shadow-sm">
                <i class="fa-solid fa-print text-xs"></i>
                <span>Címke nyomtatása</span>
            </button>
            <button onclick="resetForm()" class="w-full bg-white hover:bg-slate-100 text-slate-700 font-medium py-1.5 px-3 border border-slate-300 rounded-xl text-xs flex items-center justify-center space-x-2">
                <i class="fa-solid fa-rotate-left text-slate-400"></i>
                <span>Új címke</span>
            </button>
        </div>
    </div>

    <!-- NYOMTATÁSI STRUKTÚRA (100mm x 75mm) -->
    <div class="print-only-label">
        <div style="font-size: 11pt; font-weight: 800; text-align: center; border-bottom: 1.5pt solid #000; padding-bottom: 2mm; margin-bottom: 4mm; text-transform: uppercase;">
            Markusovszky Kórház Gyógyszertár
        </div>
        
        <div style="display: flex; justify-content: space-between; align-items: flex-start; min-height: 38mm;">
            <div style="width: 60%;">
                <!-- Beteg Neve -->
                <div style="font-size: 16pt; font-weight: 800; margin-bottom: 2mm; line-height: 1.2;">
                    <span id="printName"></span>
                </div>
                <!-- TAJ szám -->
                <div style="font-size: 13pt; font-weight: 700; margin-bottom: 2mm;">
                    <span id="printTaj"></span>
                </div>
                <!-- Osztály -->
                <div style="font-size: 13pt; margin-bottom: 2mm;">
                    <span id="printDept"></span>
                </div>
                <!-- Ágyszám -->
                <div style="font-size: 13pt; margin-bottom: 2mm;">
                    <span id="printBed"></span>
                </div>
                <!-- Dátum -->
                <div style="font-size: 13pt; font-weight: 600; margin-top: 2.5mm;">
                    <span id="printDate"></span>
                </div>
            </div>
            
            <div style="width: 38%; text-align: right; display: flex; justify-content: flex-end;">
                <canvas id="printQR" style="width: 120px; height: 120px;"></canvas>
            </div>
        </div>
        
        <!-- Alsó infók: Jóváhagyta + középen az azonosító -->
        <div style="position: absolute; bottom: 3mm; left: 5mm; right: 5mm; border-top: 1pt solid #000; padding-top: 2mm; font-size: 9.5pt; font-weight: 600; line-height: 1.35;">
            <div>Jóváhagyta: <span id="printApprove"></span></div>
            <div style="text-align: center; font-size: 9pt; font-family: monospace; margin-top: 2mm; font-weight: bold;">
                Azonosító: <span id="printID"></span>
            </div>
        </div>
    </div>

    <script>
        const patientNameInput = document.getElementById('patientName');
        const tajNumInput = document.getElementById('tajNum');
        const deptNameSelect = document.getElementById('deptName');
        const bedNumInput = document.getElementById('bedNum');
        const labelDateInput = document.getElementById('labelDate');
        const approvedBySelect = document.getElementById('approvedBy');

        let currentBarcodeID = '';
        let qrPreviewObj = null;
        let qrPrintObj = null;

        function toUTF8(str) {
            try {
                return unescape(encodeURIComponent(str));
            } catch (e) {
                return str;
            }
        }

        function generateUniqueID() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');

            currentBarcodeID = `${yyyy}${mm}${dd}${hh}${min}${ss}`;
            document.getElementById('prevID').textContent = currentBarcodeID;
            document.getElementById('printID').textContent = currentBarcodeID;
        }

        function updateQR() {
            try {
                const nameVal = patientNameInput.value.trim() || '-';
                const tajVal = tajNumInput.value.trim() || '-';
                const deptVal = deptNameSelect.value.trim() || '-';
                const bedVal = bedNumInput.value.trim() || '-';
                
                // Formátum: Betegnév??TAJ??Osztály??Ágyszám??Egyedi azonosító
                const rawQrText = `${nameVal}??${tajVal}??${deptVal}??${bedVal}??${currentBarcodeID}`;
                const utfText = toUTF8(rawQrText);

                if (typeof QRious !== 'undefined') {
                    if (!qrPreviewObj) {
                        qrPreviewObj = new QRious({
                            element: document.getElementById('previewQR'),
                            size: 110,
                            level: 'M'
                        });
                    }
                    qrPreviewObj.value = utfText;

                    if (!qrPrintObj) {
                        qrPrintObj = new QRious({
                            element: document.getElementById('printQR'),
                            size: 240,
                            level: 'M'
                        });
                    }
                    qrPrintObj.value = utfText;
                }
            } catch (err) {
                console.error("QR hiba:", err);
            }
        }

        function setTodayDate() {
            const today = new Date();
            labelDateInput.value = today.toISOString().split('T')[0];
        }

        function updatePreviews() {
            const nameVal = patientNameInput.value.trim();
            const tajVal = tajNumInput.value.trim();
            const deptVal = deptNameSelect.value;
            const bedVal = bedNumInput.value.trim();
            const dateVal = labelDateInput.value;
            const approveVal = approvedBySelect.value;

            document.getElementById('prevName').textContent = nameVal || '-';
            document.getElementById('prevTaj').textContent = tajVal ? '' + tajVal : '-';
            document.getElementById('prevDept').textContent = deptVal || '-';
            document.getElementById('prevBed').textContent = bedVal || '-';
            document.getElementById('prevDate').textContent = dateVal || '-';
            document.getElementById('prevApprove').textContent = 'Jóváhagyta: ' + approveVal;

            document.getElementById('printName').textContent = nameVal;
            document.getElementById('printTaj').textContent = tajVal;
            document.getElementById('printDept').textContent = deptVal;
            document.getElementById('printBed').textContent = bedVal;
            document.getElementById('printDate').textContent = dateVal;
            document.getElementById('printApprove').textContent = approveVal;

            updateQR();
        }

        function resetForm() {
            // Törli: Név, TAJ szám, Ágyszám
            patientNameInput.value = '';
            tajNumInput.value = '';
            bedNumInput.value = '';
            
            // Marad: Osztály, Dátum, Gyógyszerész (Jóváhagyta)
            generateUniqueID();
            updatePreviews();
            patientNameInput.focus();
        }

        function generateAndPrint() {
            updatePreviews();
            window.print();
        }

        [patientNameInput, tajNumInput, deptNameSelect, bedNumInput, labelDateInput, approvedBySelect].forEach(el => {
            el.addEventListener('input', updatePreviews);
            el.addEventListener('change', updatePreviews);
        });

        window.onload = function() {
            setTodayDate();
            generateUniqueID();
            updatePreviews();
        };
    </script>
</body>
</html>
