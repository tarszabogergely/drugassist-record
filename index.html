<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DrugAssist Record - Bejelentkezés</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Bejelentkező felület -->
  <div id="login-container" class="auth-card">
    <div class="logo">
      <span class="badge">RECORD</span>
      <h2>DrugAssist Record</h2>
    </div>
    <div id="login-form">
      <div class="form-group">
        <label>Felhasználónév</label>
        <input type="text" id="login-username" placeholder="pl. asszisztens1" required autofocus>
      </div>
      <div class="form-group">
        <label>Jelszó</label>
        <input type="password" id="login-password" required>
      </div>
      <button type="button" id="btn-login-submit" class="btn btn-primary btn-large">Bejelentkezés</button>
    </div>
  </div>

  <!-- Főmenü Dashboard (Sikeres bejelentkezés után jelenik meg) -->
  <div id="dashboard-container" class="dashboard-card hidden">
    <header class="dashboard-header">
      <h2>Gyógyszerelési Rendszer</h2>
      <div class="user-status">
        <span id="user-email-display">--</span>
        <button id="btn-logout" class="btn btn-secondary btn-sm">Kijelentkezés</button>
      </div>
    </header>

    <!-- Fő Műveletek -->
<div class="main-actions">
  <a href="pages/gyogyszereles.html" class="btn-action btn-main">
    <span class="icon">💊</span>
    <span class="title">Gyógyszerelés</span>
    <span class="sub">Tálca rögzítése & vonalkódolvasás</span>
  </a>
  
  <a href="pages/ellenorzes.html" class="btn-action btn-main btn-verify">
    <span class="icon">🔍</span>
    <span class="title">Ellenőrzés</span>
    <span class="sub">Gyógyszerészi validáció & lezárás</span>
  </a>

  <!-- ÚJ ARCHÍVUM GOMB -->
  <a href="pages/archivum.html" class="btn-action btn-main" style="border-left: 5px solid #6f42c1;">
    <span class="icon">📁</span>
    <span class="title">Archívum</span>
    <span class="sub">Napi osztályos átadók & PDF nyomtatás</span>
  </a>
</div>

    <hr class="divider">

    <!-- Másodlagos Funkciók -->
    <div class="secondary-actions">
      <a href="pages/torzs.html" class="btn-action btn-sub">
        <span class="icon">📦</span>
        <span>Gyógyszertörzs</span>
      </a>
      <a href="pages/betegek.html" class="btn-action btn-sub">
        <span class="icon">👤</span>
        <span>Betegek</span>
      </a>
      <a href="pages/felhasznalas.html" class="btn-action btn-sub">
        <span class="icon">📊</span>
        <span>Felhasználás</span>
      </a>
    </div>
  </div>

  <!-- Javascript betöltése (Szigorú sorrendben!) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
