<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DrugAssist Record - Bejelentkezés</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- 1. Bejelentkező Kártya (Bejelentkezés előtt) -->
  <div id="login-container" class="auth-card">
    <div class="logo">
      <span class="badge">RECORD</span>
      <h2>DrugAssist Record</h2>
    </div>
    <form id="login-form">
      <div class="form-group">
        <label>E-mail cím</label>
        <input type="email" id="login-email" placeholder="asszisztens@korhaz.hu" required>
      </div>
      <div class="form-group">
        <label>Jelszó</label>
        <input type="password" id="login-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-large">Bejelentkezés</button>
    </form>
  </div>

  <!-- 2. Főmenü Dashboard (Sikeres bejelentkezés után) -->
  <div id="dashboard-container" class="dashboard-card hidden">
    <header class="dashboard-header">
      <h2>Gyógyszerelési Rendszer</h2>
      <div class="user-status">
        <span id="user-email-display">--</span>
        <button id="btn-logout" class="btn btn-secondary btn-sm">Kijelentkezés</button>
      </div>
    </header>

    <!-- Fő Műveletek (Kiemelt nagy gombok) -->
    <div class="main-actions">
      <a href="pages/gyogyszereles.html" class="btn-action btn-main">
        <span class="icon">💊</span>
        <span class="title">Gyógyszerelés</span>
        <span class="sub">Tálca rögzítése & vonalkódolvasás</span>
      </a>
      
      <a href="pages/ellenorzes.html" class="btn-action btn-main btn-verify">
        <span class="icon">🔍</span>
        <span class="title">Ellenőrzés</span>
        <span class="sub">Gyógyszerészi validáció & lezárás</span>
      </a>
    </div>

    <hr class="divider">

    <!-- Másodlagos Funkciók (Kisebb gombok) -->
    <div class="secondary-actions">
      <a href="pages/torzs.html" class="btn-action btn-sub">
        <span class="icon">📦</span>
        <span>Gyógyszertörzs</span>
      </a>
      <a href="pages/betegek.html" class="btn-action btn-sub">
        <span class="icon">👤</span>
        <span>Betegek</span>
      </a>
      <a href="pages/felhasznalas.html" class="btn-action btn-sub">
        <span class="icon">📊</span>
        <span>Felhasználás</span>
      </a>
    </div>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
