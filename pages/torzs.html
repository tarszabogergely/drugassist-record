<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DrugAssist Record - Gyógyszertörzs</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* Keresősáv és Gomb egy sorba rendezése */
    .search-action-bar {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .search-action-bar .form-group {
      flex: 1;
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <!-- Fejléc -->
  <header class="app-header">
    <div class="logo">
      <h1>Gyógyszertörzs</h1>
    </div>
    <div class="user-info" style="display: flex; align-items: center; gap: 1rem;">
      <a href="../index.html" class="back-link" style="color: white; text-decoration: none; font-weight: bold; background: rgba(255,255,255,0.2); padding: 0.4rem 0.8rem; border-radius: 4px;">🏠 Főmenü</a>
      <span id="user-display">--</span>
    </div>
  </header>

  <main class="container">
    <!-- Keresés és Új Gyógyszer Kártya (Egy sorban) -->
    <section class="card" style="padding: 1.25rem;">
      <div class="search-action-bar">
        <div class="form-group">
          <input type="text" id="torzs-search-input" placeholder="🔎Keresés" autofocus style="font-size: 1.05rem; padding: 0.75rem;">
        </div>
        <button type="button" id="btn-open-add-modal" class="btn btn-success" style="background: #10b981; border-color: #059669; padding: 0.75rem 1.25rem; white-space: nowrap;">
          + Új gyógyszer felvétele
        </button>
      </div>
    </section>

    <!-- Gyógyszertörzs Táblázat -->
    <section class="card">
      <div class="table-header">
        <h2>Gyógyszertörzs (<span id="total-count">0</span> tétel)</h2>
        <button type="button" id="btn-refresh-torzs" class="btn btn-secondary btn-sm">Frissítés</button>
      </div>

      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>Vonalkód</th>
              <th>Gyógyszer neve</th>
              <th>Morfológiai leírás</th>
              <th>Műveletek</th>
            </tr>
          </thead>
          <tbody id="torzs-table-body">
            <tr class="empty-row">
              <td colspan="4">Betöltés folyamatban...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Modal: Új / Szerkesztendő Gyógyszer -->
  <div id="med-modal" class="modal">
    <div class="modal-content" style="max-width: 650px; width: 95%;">
      <div class="modal-header">
        <h3 id="modal-title" style="margin:0;">Új gyógyszer felvétele</h3>
        <span class="close-modal" id="btn-close-med-modal" style="cursor:pointer; font-size: 1.8rem;">&times;</span>
      </div>

      <form id="med-form">
        <div class="modal-body" style="padding: 1.5rem;">
          <input type="hidden" id="med-id">

          <div class="form-group">
            <label for="med-barcode">Vonalkód</label>
            <input type="text" id="med-barcode" required>
          </div>

          <div class="form-group">
            <label for="med-name">Gyógyszer neve és hatóanyag tartalma</label>
            <input type="text" id="med-name" required>
          </div>

          <div class="form-group">
            <label for="med-morphology">Morfológia</label>
            <textarea id="med-morphology" rows="3"></textarea>
          </div>
        </div>

        <div class="modal-footer" style="padding: 1rem; display: flex; justify-content: flex-end; gap: 0.5rem;">
          <button type="button" id="btn-cancel-med" class="btn btn-secondary">Mégse</button>
          <button type="submit" id="btn-save-med" class="btn btn-primary">Mentés</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript modulok -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/torzs.js"></script>
</body>
</html>
