<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DrugAssist Record - Archívum & Napi Átadók</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

  <!-- Fejléc -->
  <header class="app-header" style="background: #6f42c1;">
    <div class="logo">
      <h1>Archívum & átadók</h1>
    </div>
    <div class="user-info" style="display: flex; align-items: center; gap: 1rem;">
      <a href="../index.html" class="back-link" style="color: white; text-decoration: none; font-weight: bold; background: rgba(255,255,255,0.2); padding: 0.4rem 0.8rem; border-radius: 4px;">🏠 Főmenü</a>
      <span id="user-display">--</span>
    </div>
  </header>

  <main class="container">
    <!-- Napválasztó Kártya (Feliratok nélkül, letisztítva) -->
    <section class="card" style="padding: 1.25rem;">
      <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
        <div class="form-group" style="margin-bottom: 0;">
          <input type="date" id="archive-date-picker" style="font-size: 1rem; padding: 0.5rem 0.75rem;">
        </div>
        <button type="button" id="btn-today" class="btn btn-secondary" style="padding: 0.55rem 1rem;">Mai nap</button>
        <button type="button" id="btn-load-archive" class="btn btn-primary" style="padding: 0.55rem 1.25rem; background: #6f42c1; border-color: #59359a;">Szűrés</button>
      </div>
    </section>

    <!-- Osztályonkénti Konténer -->
    <div id="wards-container">
      <div class="card">
        <p class="empty-row">Töltse be a kiválasztott nap adatait...</p>
      </div>
    </div>
  </main>

  <!-- Modal: Beteg Gyógyszerelési Előzményei -->
  <div id="patient-history-modal" class="modal">
    <div class="modal-content" style="max-width: 850px; width: 95%;">
      <div class="modal-header" style="background: #6f42c1; color: white;">
        <h3 style="margin:0;">Gyógyszerelési Részletek: <span id="h-patient-name">--</span></h3>
        <span class="close-modal" id="btn-close-history-modal" style="color:white; cursor:pointer; font-size: 1.8rem;">&times;</span>
      </div>

      <div class="modal-body" style="padding: 1.5rem;">
        <div id="modal-patient-info" style="margin-bottom: 1rem; background: #f8f9fa; padding: 0.8rem; border-radius: 4px;">
          <!-- Dinamikus alapadatok -->
        </div>

        <h4>Rögzített Gyógyszerek Mátrixa:</h4>
        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th>Gyógyszernév</th>
                <th>LOT / Lejárat</th>
                <th>Reggel</th>
                <th>Délben</th>
                <th>Este</th>
                <th>Éjjel</th>
              </tr>
            </thead>
            <tbody id="patient-items-body">
              <tr class="empty-row">
                <td colspan="6">Betöltés...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript modulok -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/archivum.js"></script>
</body>
</html>
